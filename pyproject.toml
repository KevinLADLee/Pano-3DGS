[project]
name = "pano-3dgs"
version = "0.1.0"
description = "Pipeline utilities for converting 360 equirectangular videos into standard COLMAP/3DGS cubemap datasets."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "einops",
  "numpy",
  "opencv-python",
  "pillow",
  "psutil",
  "pycocotools",
  "sam3 @ file:///tmp/sam3-official",
]

[project.scripts]
pano-3dgs = "pano_3dgs.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true
