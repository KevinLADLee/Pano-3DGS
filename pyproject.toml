[project]
name = "pano-3dgs"
version = "0.1.0"
description = "Pipeline utilities for converting 360 equirectangular videos into PyCOLMAP panorama SfM datasets for 3DGS."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "einops",
  "numpy",
  "opencv-python",
  "pillow",
  "psutil",
  "pycocotools",
  "sam3",
  "setuptools<81",
  "torch==2.10.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "torchvision==0.25.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
sam3 = { path = "third_party/sam3" }

[project.scripts]
pano-3dgs = "pano_3dgs.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true
