# Copy to pano3dgs.toml and adjust local paths.
# CLI flags override this file for a single invocation.

[paths]
runs_dir = "runs"

[run]
rate_hz = 2.0
equirect_width = 7680
equirect_height = 3840
sfm_workflow = "equirect"

[extract]
window_seconds = 0.5
scale_width = 1920
roi = [0.0, 0.08, 1.0, 0.92]
fallback_fps = 30.0
frame_jpg_quality = 98
progress = 300

[sfm]
gpu_index = "0"
threads = 8
max_features = 12000
feature_type = "sift"
feature_matcher = "auto"
# aliked_model_path = "models/colmap/aliked-n16rot.onnx"
# feature_type = "aliked_n16rot"
# feature_matcher = "aliked_lightglue"
# aliked_matcher_model_path = "models/colmap/aliked-lightglue.onnx"
overlap = 25

[pycolmap]
require_cuda = true

[sam3]
model = "models/facebook/sam3"
device = "cuda:0"
dtype = "bfloat16"
prompts = ["sky"]
skip = false
score = 0.35
min_area = 0.00005
max_area = 0.80
dilate = 7

[masks]
heuristics = "auto"
progress = 50
sky_mask = true
zenith_mask = 0.04
nadir_mask = 0.04

[panorama_sfm]
render_type = "perspective_overlapping"
virtual_camera_model = "pinhole"
matcher = "sequential"
mapper = "incremental"
ba_backend = "caspar"
loop_detection = false
workers = 0
use_input_masks = true
rerender_perspective = false
rerun_features = false
rerun_matching = false
clean = false

[equirect_sfm]
matcher = "sequential"
mapper = "incremental"
ba_backend = "caspar"
loop_detection = false
use_input_masks = true
rerun_features = false
rerun_matching = false
clean = false

[pinhole_3dgs]
enabled = true
render_type = "perspective_overlapping"
workers = 0
use_input_masks = true
rerender = false
min_track_length = 2
clean = false
